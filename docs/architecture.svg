<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">dsh-storage-inspector architecture</title><desc id="desc">One scanner reads the local DSH directory and feeds the Settings page and storage_report tool.</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.b{stroke:#334155;stroke-width:2;rx:18}.i{fill:#eef4ff;stroke:#4263a5}.m{fill:#e8f7ef;stroke:#237a4b}.o{fill:#fff6df;stroke:#b7791f}.g{stroke:#58657a;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0l10 3.5L0 7z" fill="#58657a"/></marker></defs><rect width="1200" height="560" fill="#fff"/><text x="50" y="55" class="t">One scanner, two entry points, read-only by design</text><text x="50" y="85" class="s">The measurement rules live in lib/scan.js and are shared by every surface.</text><rect x="60" y="155" width="270" height="150" class="b i"/><text x="195" y="200" text-anchor="middle" class="h">Local DSH directory</text><text x="195" y="235" text-anchor="middle" class="s">~/.dsh or DSH_HOME</text><text x="195" y="270" text-anchor="middle" class="s">physical + logical size</text><path d="M330 230h120" class="g"/><rect x="450" y="120" width="300" height="220" class="b m"/><text x="600" y="170" text-anchor="middle" class="h">Shared scanner</text><text x="600" y="210" text-anchor="middle" class="s">lib/scan.js</text><text x="600" y="245" text-anchor="middle" class="s">symlinks skipped · hard links deduped</text><text x="600" y="280" text-anchor="middle" class="s">cache + explainable advice</text><path d="M750 195h110M750 280h110" class="g"/><rect x="860" y="135" width="280" height="125" class="b o"/><text x="1000" y="180" text-anchor="middle" class="h">Settings → Storage</text><text x="1000" y="220" text-anchor="middle" class="s">dashboard · modules · advice</text><rect x="860" y="300" width="280" height="125" class="b o"/><text x="1000" y="345" text-anchor="middle" class="h">storage_report</text><text x="1000" y="385" text-anchor="middle" class="s">summary or detail=full</text><rect x="220" y="445" width="760" height="70" class="b" fill="#f4f5f7"/><text x="600" y="488" text-anchor="middle" class="h">No delete · no move · no network · loopback-only endpoint</text></svg>