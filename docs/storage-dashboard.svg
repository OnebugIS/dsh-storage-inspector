<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Storage dashboard schematic</title><desc id="desc">A schematic dashboard showing total usage, logical size, reclaimable cache, module bars, largest files, and three advice levels.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.v{font-size:26px;font-weight:700}.s{font-size:14px}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#edf4ff;stroke:#4263a5}.green{fill:#eaf8ef;stroke:#237a4b}.amber{fill:#fff7e5;stroke:#b7791f}.red{fill:#fff0f0;stroke:#b42318}.bar1{fill:#4263a5}.bar2{fill:#6b8ed6}.bar3{fill:#9db4e6}.line{stroke:#e2e8f0;stroke-width:2}</style></defs>
  <rect width="1200" height="720" fill="#f8fafc"/><text x="50" y="48" class="title">Settings → Storage (schematic)</text><text x="50" y="75" class="s">Illustration only · values are examples, not a real machine snapshot.</text>
  <rect x="50" y="105" width="250" height="130" rx="14" class="card blue"/><text x="75" y="140" class="h">Total physical usage</text><text x="75" y="185" class="v">12.4 GB</text><text x="75" y="215" class="s">Finder / du-like blocks</text>
  <rect x="325" y="105" width="250" height="130" rx="14" class="card"/><text x="350" y="140" class="h">Logical size</text><text x="350" y="185" class="v">10.8 GB</text><text x="350" y="215" class="s">sum of file contents</text>
  <rect x="600" y="105" width="250" height="130" rx="14" class="card green"/><text x="625" y="140" class="h">Reclaimable cache</text><text x="625" y="185" class="v">1.6 GB</text><text x="625" y="215" class="s">safe advice, read-only preview</text>
  <rect x="875" y="105" width="275" height="130" rx="14" class="card"/><text x="900" y="140" class="h">Freshness</text><text x="900" y="180" class="s">cached within 5 min</text><text x="900" y="207" class="s">↻ Rescan (force=1)</text>
  <rect x="50" y="265" width="535" height="390" rx="14" class="card"/><text x="78" y="305" class="h">Modules</text><text x="78" y="338" class="s">physical usage</text><text x="78" y="380" class="s">profiles</text><rect x="170" y="365" width="330" height="22" rx="5" class="bar1"/><text x="515" y="382" class="s">6.2 GB</text><text x="78" y="430" class="s">sessions</text><rect x="170" y="415" width="240" height="22" rx="5" class="bar2"/><text x="425" y="432" class="s">4.1 GB</text><text x="78" y="480" class="s">cache</text><rect x="170" y="465" width="95" height="22" rx="5" class="bar3"/><text x="280" y="482" class="s">1.6 GB</text><text x="78" y="530" class="s">other</text><rect x="170" y="515" width="45" height="22" rx="5" class="bar3"/><text x="240" y="532" class="s">0.5 GB</text><line x1="78" y1="565" x2="540" y2="565" class="line"/><text x="78" y="600" class="h">Largest files</text><text x="78" y="630" class="s">profiles/.../index.db · 820 MB</text>
  <rect x="620" y="265" width="530" height="390" rx="14" class="card"/><text x="648" y="305" class="h">Advice</text><rect x="648" y="330" width="474" height="75" rx="10" class="green"/><text x="670" y="360" class="h">SAFE · cache</text><text x="670" y="385" class="s">Can be rebuilt; inspect before cleanup.</text><rect x="648" y="425" width="474" height="75" rx="10" class="amber"/><text x="670" y="455" class="h">CAUTION · sessions</text><text x="670" y="480" class="s">May remove history or attachments.</text><rect x="648" y="520" width="474" height="75" rx="10" class="red"/><text x="670" y="550" class="h">FORBIDDEN · dsh-runtimes</text><text x="670" y="575" class="s">Required to start DSH; do not delete.</text>
</svg>